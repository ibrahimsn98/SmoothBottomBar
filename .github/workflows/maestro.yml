name: Maestro

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  maestro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug

      - name: Install Maestro CLI
        run: curl -Ls "https://get.maestro.mobile.dev" | bash

      - name: Run Maestro flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 32
          arch: x86_64
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            $HOME/.maestro/bin/maestro test --format=junit --output=maestro-report.xml .maestro/

      - name: Upload results to Qualflare
        # PR runs (especially from forks) don't have access to repository
        # secrets, so only upload on pushes to the head branch.
        if: always() && github.event_name == 'push'
        uses: Qualflare/qualflare-action@v1
        with:
          token: ${{ secrets.QUALFLARE_TOKEN }}
          project: smoothbottombar
          results: maestro-report.xml
